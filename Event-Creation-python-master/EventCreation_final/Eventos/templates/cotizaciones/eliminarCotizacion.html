{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-black text-white flex items-center justify-center px-4">
    <div class="bg-gray-900 border border-gray-800 rounded-lg p-8 max-w-md w-full text-center">
        <i class="fas fa-exclamation-triangle text-5xl text-yellow-400 mb-4"></i>
        <h2 class="text-2xl font-bold mb-2">¿Eliminar cotización?</h2>
        <p class="text-gray-400 mb-6">
            Esta acción eliminará la cotización del evento
            <span class="text-yellow-400 font-semibold">{{ object.evento.titulo }}</span>.
            No se puede deshacer.
        </p>
        <form method="post" class="flex gap-4 justify-center">
            {% csrf_token %}
            <button type="submit"
                class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-full transition">
                <i class="fas fa-trash mr-2"></i> Eliminar
            </button>
            <a href="{% url 'listaCotizaciones' %}"
                class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-full transition">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
