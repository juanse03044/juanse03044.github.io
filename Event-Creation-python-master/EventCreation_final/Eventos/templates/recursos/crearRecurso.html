<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recurso</title>
<script src="https://cdn.tailwindcss.com"></script>

 <style>
        #id_nombre, #id_descripcion, #id_tipoEvento {
            width: 100%;
            padding: 0.5rem 1rem;
            background-color: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            color: white;
        }
    </style>


</head>

<body class="bg-slate-900 flex items-center justify-center min-h-screen text-white">

<div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md">

<h2 class="text-2xl font-bold mb-6 text-center text-yellow-400">
    {% if form.instance.pk %}
        Editar Recurso
    {% else %}
        Crear Recurso
    {% endif %}
</h2>

<form method="POST">
    {% csrf_token %}

    <!-- NOMBRE -->
    <div class="mb-4">
        <label class="block mb-1">Nombre</label>
        {{ form.nombre }}
    </div>

    <!-- DESCRIPCIÓN -->
    <div class="mb-4">
        <label class="block mb-1">Descripción</label>
        {{ form.descripcion }}
    </div>

    <!-- TIPO EVENTO -->
    <div class="mb-4">
        <label class="block mb-1">Tipo Evento</label>
        {{ form.tipoEvento }}
    </div>

    <!-- BOTONES -->
    <div class="flex justify-between mt-6">

        <a href="{% url 'listaRecursos' %}" 
           class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold hover:bg-yellow-400 transition">
            Volver
        </a>

        <button type="submit" 
            class="bg-yellow-400 text-black px-5 py-2 rounded-lg font-bold hover:bg-yellow-300 transition">
            {% if form.instance.pk %}
                Actualizar
            {% else %}
                Guardar
            {% endif %}
        </button>

    </div>

</form>

</div>

</body>
</html>
