<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eliminar Tipo Evento</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

<div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md text-center">

    <h2 class="text-2xl font-bold text-red-400 mb-6">
        ¿Eliminar Tipo Evento?
    </h2>

    <p class="mb-6">
        ¿Estás seguro que deseas eliminar este tipo de evento?
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="flex justify-between">

            <a href="{% url 'listaTipoEvento' %}" 
               class="bg-gray-600 px-4 py-2 rounded hover:bg-gray-500">
                Cancelar
            </a>

            <button type="submit" 
                class="bg-red-500 px-4 py-2 rounded hover:bg-red-400">
                Eliminar
            </button>

        </div>
    </form>

</div>

</body>
</html>
