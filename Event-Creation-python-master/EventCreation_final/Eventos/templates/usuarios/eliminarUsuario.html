<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Usuario</title>


<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        background-color: #0f172a;
    }
</style>


</head>

<body class="flex items-center justify-center min-h-screen text-white">


<div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md text-center">

    <h1 class="text-2xl font-bold text-red-400 mb-4">
        ⚠️ Eliminar Usuario
    </h1>

    <p class="mb-4">
        ¿Estás seguro que deseas eliminar este usuario?
    </p>

    <p class="text-yellow-400 font-semibold mb-6">
        {{ object.nombre }} {{ object.apellido }}
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="flex justify-between">

            <!-- Botón Cancelar -->
            <a href="{% url 'listaUsuarios' %}"
               class="bg-gray-600 px-4 py-2 rounded-lg hover:bg-gray-500 transition">
                Cancelar
            </a>

            <!-- Botón Eliminar -->
            <button type="submit"
                    class="bg-red-500 px-4 py-2 rounded-lg font-bold hover:bg-red-600 transition">
                Eliminar
            </button>

        </div>
    </form>

</div>


</body>
</html>
