<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eliminar Administrador</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 flex items-center justify-center min-h-screen text-white">

<div class="bg-gray-800 p-8 rounded-xl shadow-lg text-center w-96">


<h2 class="text-2xl font-bold text-yellow-400 mb-4">
    ¿Eliminar administrador?
</h2>

<p class="mb-6 text-gray-300">
    Estás a punto de eliminar:
    <br>
    <span class="font-bold text-white">
        {{ object.nombre }} {{ object.apellido }}
    </span>
</p>

<form method="POST">
    {% csrf_token %}

    <div class="flex justify-center space-x-4">

        <button type="submit" 
            class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded font-bold">
            Sí, eliminar
        </button>

        <a href="{% url 'listaAdministradores' %}" 
           class="bg-yellow-400 text-black px-4 py-2 rounded font-bold hover:bg-yellow-300">
            Cancelar
        </a>

    </div>
</form>


</div>

</body>
</html>
