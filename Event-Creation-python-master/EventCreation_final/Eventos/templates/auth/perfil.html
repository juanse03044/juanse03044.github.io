<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Event Creation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen">

    <header class="py-6 px-4 bg-gray-900 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="{% url 'inicio' %}" class="text-3xl font-bold text-yellow-400">EVENT CREATION</a>
            <div class="flex items-center gap-4">
                <span class="text-gray-300 text-sm">{{ request.session.usuario_nombre }}</span>
                <a href="{% url 'logout' %}" class="text-gray-400 hover:text-yellow-400 text-sm transition">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <div class="max-w-2xl mx-auto px-4 py-12">
        {% if messages %}
            {% for m in messages %}
            <div class="mb-4 px-4 py-3 rounded-md text-sm bg-green-900 text-green-300">{{ m }}</div>
            {% endfor %}
        {% endif %}

        <div class="bg-gray-900 rounded-lg p-8 border border-gray-800">
            <div class="flex items-center gap-4 mb-8">
                <div class="w-16 h-16 rounded-full bg-yellow-500 flex items-center justify-center">
                    <i class="fas fa-user text-black text-2xl"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold">{{ usuario.nombre }} {{ usuario.apellido }}</h2>
                    <span class="text-xs px-2 py-1 rounded-full
                        {% if usuario.rol == 'admin' %}bg-yellow-500 text-black{% else %}bg-gray-700 text-gray-300{% endif %}">
                        {{ usuario.rol }}
                    </span>
                </div>
            </div>

            <div class="space-y-4 mb-8">
                <div class="flex justify-between border-b border-gray-800 pb-3">
                    <span class="text-gray-400">Correo</span>
                    <span>{{ usuario.email }}</span>
                </div>
                <div class="flex justify-between border-b border-gray-800 pb-3">
                    <span class="text-gray-400">Estado</span>
                    <span class="{% if usuario.estado == 'activo' %}text-green-400{% else %}text-red-400{% endif %}">
                        {{ usuario.estado }}
                    </span>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <a href="{% url 'editar_perfil' %}"
                    class="flex-1 text-center bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 px-4 rounded-md transition">
                    Editar perfil
                </a>
                <a href="{% url 'cambiar_password' %}"
                    class="flex-1 text-center border border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-black font-bold py-2 px-4 rounded-md transition">
                    Cambiar contraseña
                </a>
            </div>
        </div>
    </div>

</body>
</html>
