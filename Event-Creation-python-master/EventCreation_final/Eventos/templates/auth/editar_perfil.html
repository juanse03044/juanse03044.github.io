<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Event Creation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-black text-white min-h-screen">
    <header class="py-6 px-4 bg-gray-900 shadow-lg">
        <div class="max-w-7xl mx-auto">
            <a href="{% url 'inicio' %}" class="text-3xl font-bold text-yellow-400">EVENT CREATION</a>
        </div>
    </header>
    <div class="max-w-md mx-auto px-4 py-12">
        <div class="bg-gray-900 rounded-lg p-8 border border-gray-800">
            <h2 class="text-2xl font-bold text-yellow-400 mb-6">Editar perfil</h2>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-5">
                    <label class="block text-gray-300 mb-2 text-sm">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>{% endif %}
                </div>
                {% endfor %}
                <div class="flex gap-3 mt-6">
                    <button type="submit" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 rounded-md transition">Guardar</button>
                    <a href="{% url 'perfil' %}" class="flex-1 text-center border border-gray-600 text-gray-400 hover:border-yellow-400 hover:text-yellow-400 font-bold py-3 rounded-md transition">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
